---
name: Test dot input - include dotfiles/dotfolders
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a valid markdown file in a dot-prefixed directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/tmp-dot/.hidden-dir"
          cat > "$GITHUB_WORKSPACE/tests/tmp-dot/.hidden-dir/readme.md" << 'EOF'
          # Hidden Directory Markdown

          This file is inside a dot-prefixed directory.

          ## Section

          Content here.
          EOF

      - name: Run markdownlint with dot option to include hidden directories
        id: action
        uses: .
        with:
          files: tests/tmp-dot
          dot: "true"

      - name: Assert action succeeded (dot files included and valid)
        run: |
          echo "PASS: markdownlint passed with dot option enabled, including hidden directories"
