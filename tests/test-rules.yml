---
name: Test rules input (custom rule file)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create markdown file and custom rule
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/tmp-rules"
          # Create a simple valid markdown file
          cat > "$GITHUB_WORKSPACE/tests/tmp-rules/sample.md" << 'EOF'
          # Sample Document

          This is a sample markdown file for testing custom rules.

          ## Section

          Content here.
          EOF
          # Create a custom markdownlint rule (no-op rule that never fires)
          cat > "$GITHUB_WORKSPACE/tests/tmp-rules/custom-rule.js" << 'EOF'
          module.exports = {
            names: ["custom-noop"],
            description: "A no-op custom rule for testing",
            tags: ["test"],
            function: function rule(params, onError) {
              // This rule never triggers any errors
            }
          };
          EOF

      - name: Run markdownlint with custom rules input
        id: action
        uses: .
        with:
          files: tests/tmp-rules/sample.md
          rules: tests/tmp-rules/custom-rule.js

      - name: Assert action succeeded with custom rule
        run: |
          echo "PASS: markdownlint passed with custom rule file provided via rules input"
