---
name: Test rules input - custom rule file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create markdown file and custom rule
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/tmp-rules"

          # Valid markdown file with no blockquotes (passes the custom rule)
          cat > "$GITHUB_WORKSPACE/tests/tmp-rules/valid.md" << 'EOF'
          # Valid Markdown

          This file has no blockquotes, so the custom rule will not trigger.

          ## Section

          - Item one
          - Item two
          EOF

          # Custom rule: reports an error for any blockquote
          cat > "$GITHUB_WORKSPACE/tests/tmp-rules/no-blockquotes.js" << 'EOF'
          "use strict";
          module.exports = {
            "names": ["custom-no-blockquote"],
            "description": "Rule that reports an error for any blockquote",
            "tags": ["test"],
            "function": function rule(params, onError) {
              params.tokens.filter(function(token) {
                return token.type === "blockquote_open";
              }).forEach(function(blockquote) {
                onError({
                  "lineNumber": blockquote.lineNumber,
                  "detail": "Blockquote not allowed."
                });
              });
            }
          };
          EOF

      - name: Run markdownlint with custom rule on file without blockquotes
        id: action
        uses: .
        with:
          files: tests/tmp-rules/valid.md
          rules: tests/tmp-rules/no-blockquotes.js

      - name: Assert action succeeded (no blockquotes, custom rule passes)
        run: |
          echo "PASS: markdownlint succeeded with custom rule applied to file without blockquotes"
