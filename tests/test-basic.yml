---
name: Test basic usage - valid markdown
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a valid markdown file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/tmp-basic"
          printf '# Valid Markdown\n\nThis is a valid markdown file.\n\n## Section Two\n\n- Item one\n- Item two\n- Item three\n\n## Section Three\n\nSome more content here.\n' \
            > "$GITHUB_WORKSPACE/tests/tmp-basic/valid.md"

      - name: Run markdownlint on valid file
        id: action
        uses: .
        with:
          files: tests/tmp-basic/valid.md

      - name: Assert action succeeded
        run: |
          echo "PASS: markdownlint passed on valid markdown"
