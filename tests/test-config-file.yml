---
name: Test config file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create markdown file and custom config
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/tmp-config"

          # Config that disables MD013 (line length) and MD041 (first line heading)
          cat > "$GITHUB_WORKSPACE/tests/tmp-config/.markdownlintrc" << 'EOF'
          {
            "MD013": false,
            "MD041": false
          }
          EOF

          # Markdown file that would fail MD041 (no top-level heading) without config
          cat > "$GITHUB_WORKSPACE/tests/tmp-config/content.md" << 'EOF'
          ## Secondary Heading

          This file starts with a secondary heading which would normally violate MD041,
          but the config disables that rule. This line is also quite long and would
          normally violate MD013 but that rule is also disabled.

          - Item one
          - Item two
          EOF

      - name: Run markdownlint with custom config
        id: action
        uses: .
        with:
          config_file: tests/tmp-config/.markdownlintrc
          files: tests/tmp-config/content.md

      - name: Assert action succeeded with custom config
        run: |
          echo "PASS: markdownlint ran successfully with custom config that disables MD041 and MD013"
