---
name: Test ignore files input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create markdown files (one valid, one invalid)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/tmp-ignore"
          # Valid file
          cat > "$GITHUB_WORKSPACE/tests/tmp-ignore/valid.md" << 'EOF'
          # Valid Markdown

          This is a valid markdown file.

          ## Section

          Content here.
          EOF
          # Invalid file with violations (will be ignored)
          printf 'Some text without a heading first\n## Heading without blank line above\nMore text\n' \
            > "$GITHUB_WORKSPACE/tests/tmp-ignore/invalid.md"

      - name: Run markdownlint ignoring the invalid file
        id: action
        uses: .
        with:
          files: tests/tmp-ignore
          ignore_files: tests/tmp-ignore/invalid.md

      - name: Assert action succeeded (invalid file was ignored)
        run: |
          echo "PASS: markdownlint passed because invalid file was ignored"
