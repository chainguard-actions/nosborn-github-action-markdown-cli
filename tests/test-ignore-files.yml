---
name: Test ignore files input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run markdownlint with bad file ignored
        id: action
        uses: .
        with:
          files: tests/fixtures/valid.md tests/fixtures/bad-ignored.md
          ignore_files: tests/fixtures/bad-ignored.md

      - name: Assert action succeeded (bad file was ignored)
        run: |
          echo "Action completed successfully with ignored file (exit 0)"
          echo "PASS"
