---
name: Test lint failure - invalid markdown
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a markdown file with lint errors
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/tmp-failure"
          # MD022: Headings should be surrounded by blank lines
          # MD041: First line should be a top-level heading (missing here)
          # MD009: Trailing spaces
          printf 'some text without heading\n## Missing blank line above\ntext\n## Another heading\n' \
            > "$GITHUB_WORKSPACE/tests/tmp-failure/invalid.md"

      - name: Run markdownlint on invalid file (expect failure)
        id: action
        uses: .
        with:
          files: tests/tmp-failure/invalid.md
        continue-on-error: true

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected markdownlint to fail on invalid markdown, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: markdownlint correctly failed on invalid markdown"
