---
name: Test lint failure - invalid markdown
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create invalid markdown file (missing blank lines, trailing spaces, etc.)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/tmp-failure"
          # Create a file with multiple markdownlint violations:
          # MD022: Headings should be surrounded by blank lines
          # MD041: First line should be a top-level heading (missing)
          printf 'Some text without a heading first\n## Heading without blank line above\nMore text\n' \
            > "$GITHUB_WORKSPACE/tests/tmp-failure/invalid.md"

      - name: Run markdownlint on invalid file (expect failure)
        id: action
        uses: .
        with:
          files: tests/tmp-failure/invalid.md
        continue-on-error: true

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected markdownlint to fail on invalid markdown, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: markdownlint correctly failed on invalid markdown"
