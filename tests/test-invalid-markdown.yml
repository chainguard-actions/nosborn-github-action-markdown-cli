name: Test invalid markdown fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create an invalid markdown file (missing blank lines around headings)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/md-test"
          printf '# Title\nsome text without blank line after heading\n## Section\nmore text\n' \
            > "$GITHUB_WORKSPACE/md-test/invalid.md"
      - name: Run markdownlint on invalid file (expect failure)
        id: action
        uses: .
        with:
          files: md-test/invalid.md
        continue-on-error: true
      - name: Assert action failed on invalid markdown
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected markdownlint to fail on invalid markdown, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: markdownlint correctly failed on invalid markdown"
