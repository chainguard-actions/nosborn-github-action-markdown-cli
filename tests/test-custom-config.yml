---
name: Test custom config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run markdownlint with custom config
        id: action
        uses: .
        with:
          config_file: tests/fixtures/custom-config.json
          files: tests/fixtures/needs-config.md

      - name: Assert action succeeded with custom config
        run: |
          echo "Action completed successfully with custom config (exit 0)"
          echo "PASS"
