---
name: Test ignore_path input - ignore patterns from file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/tmp-ignore-path"
          # Create a valid markdown file
          printf '# Valid Markdown\n\nThis is a valid markdown file.\n\n## Section\n\nSome content here.\n' \
            > "$GITHUB_WORKSPACE/tests/tmp-ignore-path/valid.md"
          # Create an invalid markdown file (MD041: no top-level heading)
          printf '## No top-level heading\nsome text\n## Another heading\n' \
            > "$GITHUB_WORKSPACE/tests/tmp-ignore-path/invalid.md"
          # Create an ignore file listing the invalid file
          printf 'tests/tmp-ignore-path/invalid.md\n' \
            > "$GITHUB_WORKSPACE/tests/tmp-ignore-path/.markdownlintignore"

      - name: Run markdownlint using ignore_path to exclude invalid file
        id: action
        uses: .
        with:
          files: tests/tmp-ignore-path
          ignore_path: tests/tmp-ignore-path/.markdownlintignore

      - name: Assert action succeeded (invalid file was excluded via ignore_path)
        run: |
          echo "PASS: markdownlint passed because invalid file was excluded via ignore_path"
