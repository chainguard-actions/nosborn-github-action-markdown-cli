---
name: Test ignore_path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create markdown files and ignore path file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/tmp-ignore-path"

          # Valid markdown file
          cat > "$GITHUB_WORKSPACE/tests/tmp-ignore-path/good.md" << 'EOF'
          # Good Markdown

          This is a valid markdown file.

          ## Section

          - Item one
          - Item two
          EOF

          # Invalid markdown file (MD041: no top-level heading)
          printf '## Bad heading\n\nNo top-level heading here.\n' \
            > "$GITHUB_WORKSPACE/tests/tmp-ignore-path/bad.md"

          # Create an ignore patterns file listing the bad file
          echo "tests/tmp-ignore-path/bad.md" \
            > "$GITHUB_WORKSPACE/tests/tmp-ignore-path/.markdownlintignore"

      - name: Run markdownlint using ignore_path to exclude the bad file
        id: action
        uses: .
        with:
          files: tests/tmp-ignore-path
          ignore_path: tests/tmp-ignore-path/.markdownlintignore

      - name: Assert action succeeded (bad file was excluded via ignore_path)
        run: |
          echo "PASS: markdownlint succeeded because the invalid file was excluded via ignore_path"
