---
name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@2541b1294d2704b0964813337f33b291d3f8596b # v3.0.2
      - uses: actions/setup-python@b55428b1882923874294fa556849718a1d7f2ca5 # v4.2.0
        with:
          python-version: 3.x
      - uses: pre-commit/action@646c83fcd040023954eafda54b4db0192ce70507 # v3.0.0

  local-test:
    needs: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@2541b1294d2704b0964813337f33b291d3f8596b # v3.0.2
      - name: Test problem matcher
        id: expect-failure
        uses: ./
        with:
          config_file: .markdownlintrc
          files: .
          rules: examples/rules/custom.js
        continue-on-error: true
      - if: ${{ steps.expect-failure.outcome != 'failure' }}
        run: |
          exit 1
      - name: Test ignore_files
        uses: ./
        with:
          config_file: .markdownlintrc
          files: .
          ignore_files: examples/ignore/*
          rules: examples/rules/custom.js
      - name: Test ignore_path
        uses: ./
        with:
          config_file: .markdownlintrc
          files: .
          ignore_path: examples/.markdownlintignore
          rules: examples/rules/custom.js
